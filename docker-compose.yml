version: '3.8'
services:
  mongo:
    image: mongo:6.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  ml-service:
    build: ./ml_service
    ports:
      - '8000:8000'
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - mongo

  web:
    build: .
    command: npm run dev
    volumes:
      - ./:/app
    ports:
      - '3000:3000'
    environment:
      - ML_SERVICE_URL=http://ml-service:8000
      - MONGODB_URI=mongodb://root:example@mongo:27017/finwise?authSource=admin
    depends_on:
      - mongo
      - ml-service

volumes:
  mongo-data:
    driver: local
